[project]
name = "vault-ontology"
version = "0.1.0"
description = "vault-cli 재구현으로 배우는 지식 그래프와 온톨로지"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "owlrl>=7.6.2",
    "pyshacl>=0.40.1",
    "rdflib>=7.6.0",
]

[project.scripts]
vault = "vault.__main__:main"
# `vo` is the same entry point under a short name, the way vault-vector has
# `vv`. Type `vo` by hand; write `vault` in documents and scripts.
vo = "vault.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vault"]

# The two `.ttl` files are data of record and live beside the code, not
# inside the package — `vault-ontology.ttl` is read by tests and docs as a
# document. They still have to travel with an install, or `vault validate`
# on an installed tool cannot find its own shapes.
[tool.hatch.build.targets.wheel.force-include]
"vault-shapes.ttl" = "vault/vault-shapes.ttl"
"vault-ontology.ttl" = "vault/vault-ontology.ttl"
